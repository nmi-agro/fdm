services:
  fdm-app:
    build:
      context: .
      dockerfile: ./fdm-app/dockerfile
    ports:
      - "5173:5173"
    environment:
      # General Configuration
      - NODE_ENV=${NODE_ENV:-development}
      - PUBLIC_FDM_NAME=${PUBLIC_FDM_NAME:-FDM}
      - PUBLIC_FDM_URL=${PUBLIC_FDM_URL:-http://localhost:5173}
      - PUBLIC_FDM_API_URL=${PUBLIC_FDM_API_URL:-http://fdm-api:8080}
      - FDM_SESSION_SECRET=${FDM_SESSION_SECRET:-dev-session-secret-change-in-production-min-32-chars}

      # Database Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fdm-app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

      # Authentication (Better Auth)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-in-production-min-32-chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:5173}
      # Social OAuth (Optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}
      - MS_PRIVATE_KEY=${MS_PRIVATE_KEY:-}
      - MS_CERTIFICATE=${MS_CERTIFICATE:-}
      - MS_TENANT_ID=${MS_TENANT_ID:-common}

      # Map Provider (Defaults to osm, requires no API key)
      - PUBLIC_MAP_PROVIDER=${PUBLIC_MAP_PROVIDER:-osm}
      - PUBLIC_MAPTILER_API_KEY=${PUBLIC_MAPTILER_API_KEY:-}

      # Mail Configuration (Optional - in dev, logs to console if empty)
      - POSTMARK_API_KEY=${POSTMARK_API_KEY:-}
      - POSTMARK_SENDER_ADDRESS=${POSTMARK_SENDER_ADDRESS:-}
      - POSTMARK_SENDER_NAME=${POSTMARK_SENDER_NAME:-}

      # NMI Services (Optional)
      - NMI_API_KEY=${NMI_API_KEY:-}

      # Google Cloud Storage (Optional)
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - GCS_SERVICE_ACCOUNT_KEY=${GCS_SERVICE_ACCOUNT_KEY:-}
      - GCS_SERVICE_ACCOUNT_EMAIL=${GCS_SERVICE_ACCOUNT_EMAIL:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}

      # AI Services & Helpdesk (Optional)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENABLE_TICKET_TRIAGE=${ENABLE_TICKET_TRIAGE:-}

      # Sentry Error Tracking (Optional)
      - PUBLIC_SENTRY_ORG=${PUBLIC_SENTRY_ORG:-}
      - PUBLIC_SENTRY_PROJECT=${PUBLIC_SENTRY_PROJECT:-}
      - PUBLIC_SENTRY_DSN=${PUBLIC_SENTRY_DSN:-}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - PUBLIC_SENTRY_TRACE_SAMPLE_RATE=${PUBLIC_SENTRY_TRACE_SAMPLE_RATE:-1.0}
      - PUBLIC_SENTRY_REPLAY_SAMPLE_RATE=${PUBLIC_SENTRY_REPLAY_SAMPLE_RATE:-0.1}
      - PUBLIC_SENTRY_REPLAY_SAMPLE_RATE_ON_ERROR=${PUBLIC_SENTRY_REPLAY_SAMPLE_RATE_ON_ERROR:-1.0}
      - PUBLIC_SENTRY_PROFILE_SAMPLE_RATE=${PUBLIC_SENTRY_PROFILE_SAMPLE_RATE:-1.0}

      # PostHog Analytics (Optional)
      - PUBLIC_POSTHOG_KEY=${PUBLIC_POSTHOG_KEY:-}
      - PUBLIC_POSTHOG_HOST=${PUBLIC_POSTHOG_HOST:-}
      - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID:-}
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fdm-network

  fdm-api:
    build:
      context: .
      dockerfile: ./fdm-api/dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fdm-app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-in-production-min-32-chars}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL_API:-http://localhost:8080}
      - PUBLIC_FDM_NAME=${PUBLIC_FDM_NAME:-FDM}
      - PUBLIC_FDM_URL=${PUBLIC_FDM_URL_API:-http://localhost:8080}
      - FDM_API_ALLOWED_ORIGINS=${FDM_API_ALLOWED_ORIGINS:-http://localhost:5173}
      - NMI_API_KEY=${NMI_API_KEY:-}
      - PUBLIC_SENTRY_DSN=${PUBLIC_SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      fdm-app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fdm-network

  postgres:
    image: postgis/postgis:17-3.5
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fdm-app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fdm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fdm-app"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  fdm-network:
    driver: bridge

volumes:
  postgres_data:
