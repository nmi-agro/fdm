name: Release PR Comment

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main # Only trigger for PRs targeting main

jobs:
  add-comment:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    permissions:
      pull-requests: write
      actions: write # Required to start the manual screenshot run
    steps:
      # Captures the manual screenshots on this branch, so the release ships with screenshots of
      # its own version. Only for branches of this repository, never for forks.
      - name: Start the manual screenshot run on this branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: gh workflow run manual-screenshots.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}

      - name: Add PR Comment
        uses: actions/github-script@v9
        with:
          script: |
            const isHotfix = context.payload.pull_request.head.ref.startsWith('hotfix/');
            const branchType = isHotfix ? 'Hotfix' : 'Release';
            const workflowName = 'Release'; // The name of your workflow file

            const commentBody = `
            👋 **${branchType} Branch PR Detected!**

            Before merging this Pull Request into \`main\`, please ensure you have finalized the ${branchType.toLowerCase()} by **manually running the '${workflowName}' workflow** on this \`${context.payload.pull_request.head.ref}\` branch.

            This will:
            1.  Bump package versions.
            2.  Generate changelogs.
            3.  Create Git tags.

            You can trigger the workflow from the 'Actions' tab, selecting the '${workflowName}' workflow, and choosing this \`${context.payload.pull_request.head.ref}\` branch.

            Release checklist:
            - [ ] Merge the pull request \`docs(fdm-app): update the manual screenshots\` into this branch **before** running the '${workflowName}' workflow, which must add the last commit. The screenshot run starts automatically for this branch; when no image changed, it opens no pull request.
            - [ ] Review the background pages of the user manual (\`fdm-app/app/content/manual/background\`) and update \`lastReviewed\`.
            - [ ] Production sets \`FDM_SEO_INDEXING=true\`; after deploying, \`/robots.txt\` has no \`Disallow: /\` and \`/sitemap.xml\` lists the manual.
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
